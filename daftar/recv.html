<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>استقبال طيبة</title><link rel="manifest" href="/recv.webmanifest"><meta name="theme-color" content="#0e5a3c"><link rel="apple-touch-icon" href="/i192.png">
<style>
body{font-family:system-ui,Tahoma;background:#f4f6f5;margin:0;padding:14px;color:#1c2b33}
.c{background:#fff;border-radius:16px;padding:16px;max-width:440px;margin:0 auto 12px;box-shadow:0 2px 14px #0001}
h1{font-size:20px;margin:0 0 6px;color:#0e5a3c}h2{font-size:16px;margin:0 0 8px}
p,.s{margin:4px 0;line-height:1.7;font-size:14px;color:#51606a}
input,button,select{font-family:inherit;font-size:16px;border-radius:10px;border:1px solid #cfd8d5;padding:11px;width:100%;box-sizing:border-box;margin-top:6px}
button{background:#0e5a3c;color:#fff;border:0;font-weight:700}
.r{border:1px solid #e1e8e5;border-radius:10px;padding:9px 10px;margin-top:6px;font-size:14px}
.r b{display:block;font-size:15px;color:#1c2b33}.r span{color:#51606a;font-size:13px}
.r.on{border-color:#0e5a3c;background:#eef6f2}
.g{color:#0e5a3c}.e{color:#b3261e}
</style></head><body>

<div class="c"><h1>استقبال طيبة</h1>
<p>شارك من واتساب: الموقع أو الإيصال أو جهة الاتصال، واختر «استقبال طيبة».</p>
<button id="ins">تثبيت التطبيق</button><p id="st"></p><p class="s" id="ih" style="display:none">إذا ما ظهر التثبيت تلقائياً: افتح هذا الرابط في متصفح كروم نفسه (لا من داخل واتساب)، ثم من القائمة ⋮ اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</p></div>

<div id="app"></div>
<script src="/dcust.js?v=2"></script>
<script>
let dp=null;const $=i=>document.getElementById(i),b=$("ins");
if(matchMedia("(display-mode: standalone)").matches)$("st").textContent="التطبيق مثبّت وجاهز.";
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;b.style.display="block"});
b.onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;b.style.display="none"}else $("ih").style.display="block"};
addEventListener("appinstalled",()=>{$("st").textContent="تم التثبيت."});
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
DCUST.mount($("app"));
</script></body></html>
