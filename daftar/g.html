<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دفتر أسواق طيبة — الدخول</title><meta name="theme-color" content="#0e5a3c">
<style>body{margin:0;font-family:Tahoma,system-ui,sans-serif;background:#f4f6f5;color:#1b2b24;text-align:center}main{max-width:420px;margin:0 auto;padding:44px 20px}.card{background:#fff;border:1px solid #dfe5e2;border-radius:18px;padding:30px 18px}img{width:96px;height:96px;border-radius:22px}h1{font-size:21px;margin:14px 0 4px}p{color:#56665e;font-size:15px;margin:0 0 20px}#gb{display:flex;justify-content:center;min-height:44px}.n{color:#7a8a83;font-size:13px;line-height:1.8;margin-top:18px}#err{display:none;margin-top:14px;padding:10px;border-radius:12px;background:#fdecec;color:#a32d2d;font-size:14px;line-height:1.7}</style></head>
<body><main><div class="card"><img src="i512.png" alt=""><h1>دفتر أسواق طيبة</h1><p>سجّل دخولك بحساب جوجل</p><div id="gb"></div><div id="err"></div>
<div class="n">الدخول لصاحب المحل والموظفين المسجلين فقط.<br>بعد الدخول يفتح الدفتر بنفس شكله الحالي.</div></div></main>
<script>
var APP="https://daftar.tibh-esm.workers.dev",GCID="602073315832-ohi4d153hc72bt3hgc1lafmfggh4ugrn.apps.googleusercontent.com";
var m=location.hash.match(/e=([^&]+)/);if(m){var e=document.getElementById('err');e.style.display='block';e.textContent=decodeURIComponent(m[1])==='not_allowed'?'هذا الإيميل غير مسجّل في الدفتر. اطلب من صاحب المحل إضافته.':'تعذّر الدخول، حاول مرة ثانية.'}
function go(r){if(r&&r.credential)location.replace(APP+"/auth.html#t="+encodeURIComponent(r.credential))}
function start(){google.accounts.id.initialize({client_id:GCID,callback:go,auto_select:false,cancel_on_tap_outside:true,use_fedcm_for_prompt:true});google.accounts.id.renderButton(document.getElementById('gb'),{theme:'outline',size:'large',text:'signin_with',shape:'pill',locale:'ar',width:280})}
var s=document.createElement('script');s.src="https://accounts.google.com/gsi/client";s.async=true;s.onload=start;document.head.appendChild(s);
</script></body></html>
