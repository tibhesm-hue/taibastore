<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>موقعك للتوصيل — أسواق طيبة</title>
<link rel="icon" href="logo.png">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;box-sizing:border-box;background:#f4f6f3;color:#13261d;font-family:Tahoma,sans-serif;text-align:center}
#logo{width:90px;border-radius:22px}
h1{font-size:22px;margin:0}
p{margin:0;font-size:16px;line-height:1.7;max-width:420px}
button,a.btn{display:block;width:100%;max-width:420px;box-sizing:border-box;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;font-family:inherit;text-decoration:none;cursor:pointer}
#retry{background:#0a3d2d;color:#fff}
#wa{background:#25d366;color:#fff}
#nol{background:#e3e8e4;color:#13261d}
.err{color:#b42318}
[hidden]{display:none!important}
#msg{font-weight:700;font-size:18px}
#msg:not(.err){color:#0b1f16}
#msg b{font-size:24px;color:#0a3d2d}
#mapbox{width:100%;max-width:420px}
#tabs{display:flex;gap:8px;margin-bottom:8px}
#tabs button{padding:12px;font-size:16px;background:#fff;color:#0a3d2d;border:2px solid #0a3d2d}
#tabs button.on{background:#0a3d2d;color:#fff}
#mapwrap{position:relative}
#map{height:48vh;min-height:280px;border-radius:14px;border:1px solid #cfd8d1}
#cpin{position:absolute;left:50%;top:50%;width:44px;height:56px;margin:-52px 0 0 -22px;z-index:1000;pointer-events:none;font-size:46px;line-height:56px;text-align:center;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
#me{background:#fff;color:#0a3d2d;border:2px solid #0a3d2d;margin-top:8px;padding:12px;font-size:16px}
#mapnote{font-size:14px;margin-bottom:6px}
body.mapping #logo,body.mapping h1{display:none}
</style></head><body>
<img id="logo" src="logo.png" alt="">
<h1>📍 نحدد موقعك ونرسل طلبك</h1>
<p id="msg">وافق على إذن الموقع، وبعدها نعرض لك موقعك على الخريطة.</p>
<div id="mapbox" hidden>
<div id="tabs"><button id="tMap" type="button" class="on">🗺️ خريطة</button><button id="tSat" type="button">🛰️ صور الأرض</button></div>
<p id="mapnote" class="err"></p>
<div id="mapwrap"><div id="map"></div><div id="cpin">📍</div></div>
<button id="me" type="button">🎯 ارجع لموقعي الحالي</button>
</div>
<a class="btn" id="wa" href="#" hidden>✅ موافق، أرسل الطلب على الواتساب</a>
<button id="retry" type="button" hidden>📍 حاول مرة ثانية</button>
<a class="btn" id="nol" href="#" hidden>أرسل الطلب بدون موقع (أرسله من الواتساب)</a>
<script>
const SHOP='966539137077',SHOP_LAT=26.3092878,SHOP_LNG=44.8183906;
const q=new URLSearchParams(location.search);
const order=(q.get('m')||'').slice(0,3500);
const o=(q.get('o')||'').replace(/\D/g,'').slice(0,8);
const base=order||('📍 موقعي للتوصيل'+(o?' (طلب #'+o+')':''));
const $=id=>document.getElementById(id);
const wl=t=>'https://wa.me/'+SHOP+'?text='+encodeURIComponent(t);
const sub=parseFloat(q.get('s'));
let cur=null,map=null,sat=null,osm=null,osmAlt=null,isSat=false,gpsFailed=false,mt=null;
const money=x=>String(Math.round(x*100)/100);
// مستويات التوصيل (المسافة = خط مستقيم من المحل بالكيلو): [حد المسافة كم، أقل من 20، 20 فأكثر]
const TIERS=[[0.5,2,0],[1,2,1],[1.5,3,2],[2,4,3],[1e9,5,5]];
function rkOf(la,ln){const R=6371,r=x=>x*Math.PI/180,dl=r(la-SHOP_LAT),dn=r(ln-SHOP_LNG),a=Math.sin(dl/2)**2+Math.cos(r(SHOP_LAT))*Math.cos(r(la))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(a))}
function feeOf(rk,sv){for(const t of TIERS)if(rk<t[0])return sv>=20?t[2]:t[1];return 5}
function calc(la,ln){
  const rk=rkOf(la,ln),ok=rk/0.75;
  return {km:ok,lv:ok<1?1:ok<=3?2:3,fee:feeOf(rk,sub),near:TIERS.slice(0,4).some(t=>Math.abs(rk-t[0])<0.07)};
}
function calc2(la,ln,sv){return feeOf(rkOf(la,ln),sv)}
let CR=null;
function dcode(lv){if(CR===null)CR=Math.floor(Math.random()*33);const E=Math.floor((Date.now()+3*3600e3)/864e5),P=CR*30+(E%10)*3+(lv-1);return String((P*7919+1234)%9973).padStart(4,'0')}
function show(la,ln){
  const c=calc(la,ln),fee=c.fee;
  let body=base;
  if(isNaN(sub)){
    const f20=calc2(la,ln,25),fl=calc2(la,ln,0);
    {const F=x=>x?x+' ريال':'مجاني';body+=f20!==fl?'\n\n🛵 *رسوم التوصيل (للمجهز):*\nالفاتورة أقل من 20 ← *'+F(fl)+'*\nالفاتورة 20 فأكثر ← *'+F(f20)+'*':'\n\n🛵 *رسوم التوصيل:* '+F(fl);}
  }else{
    const br='🧾 قيمة الطلب: '+money(sub)+' ريال\n🛵 التوصيل (تقديري): '+(fee?fee+' ريال':'مجاني')+'\n💰 الإجمالي التقريبي: '+money(sub+fee)+' ريال\n_والمحل يؤكد السعر النهائي_';
    const re=/^.*المجموع التقريبي.*$/m;
    body=re.test(base)?base.replace(re,()=>br):base+'\n\n'+br;
  }
  {const ok=c.km;body+='\n🏍️ مستوى المندوب: '+(ok<1?'١':ok<2?'٢':'٣');}
  if(c.near)body+='\n⚠️ راجع الدبوس';
  const t=body+'\n\n📍 موقعي (اضغطه للرسوم والخريطة): https://tibhesm-hue.github.io/taibastore/m.html?q='+la.toFixed(6)+','+ln.toFixed(6);
  $('wa').href=wl(t);$('wa').hidden=false;$('nol').hidden=true;
  $('msg').className='';
  $('msg').innerHTML=(gpsFailed?'⚠️ ما تحدد موقعك تلقائيًا، حرّك الخريطة إلى بيتك.':'✅ تم تحديد موقعك.')+'<br>🛵 رسوم التوصيل المقدرة: <b>'+(isNaN(sub)?((x,y)=>(x?x+' ريال':'مجاني')+(y!==x?'</b><br><span style="font-size:15px">ولو طلبك 20 ريال فأكثر: <b>'+(y?y+' ريال':'مجاني')+'</b></span>':'</b>'))(calc2(la,ln,0),calc2(la,ln,25)):(fee?fee+' ريال':'مجاني')+'</b>')+'<br><span style="font-size:15px;font-weight:400">إذا الدبوس مو على بيتك: حرّك الخريطة أو المس المكان، ثم اضغط «موافق».</span>';
}
let LP=null;
function loadLeaflet(){
  if(LP)return LP;
  return LP=new Promise((res,rej)=>{
    if(window.L)return res();
    const l=document.createElement('link');l.rel='stylesheet';l.href='lib/leaflet.css';document.head.appendChild(l);
    const s=document.createElement('script');s.src='lib/leaflet.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);
  });
}
function setLayer(satOn){if(!map||satOn===isSat)return;$('mapnote').textContent='';if(satOn){map.removeLayer(osm);map.removeLayer(osmAlt);sat.addTo(map)}else{map.removeLayer(sat);(map.hasLayer(osmAlt)?0:osm.addTo(map))}isSat=satOn;$('tSat').classList.toggle('on',satOn);$('tMap').classList.toggle('on',!satOn)}
async function openMap(c){
  try{await loadLeaflet()}catch(e){show(c[0],c[1]);return}
  $('mapbox').hidden=false;document.body.classList.add('mapping');
  if(!map){
    map=L.map('map',{zoomControl:true}).setView(c,17);
    sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'});
    osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
    osmAlt=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap © CARTO'});
    const watch=(layer,onFail)=>{let ok=false,er=0;layer.on('tileload',()=>{ok=true});layer.on('tileerror',()=>{if(++er===3&&!ok)onFail()});layer.on('add',()=>{ok=false;er=0;setTimeout(()=>{if(!ok&&map.hasLayer(layer))onFail()},7000)})};
    watch(osm,()=>{if(!isSat&&map.hasLayer(osm)){map.removeLayer(osm);osmAlt.addTo(map)}});
    watch(osmAlt,()=>{if(!isSat)$('mapnote').textContent='الخريطة بطيئة أو محجوبة على شبكتك. جرّب «صور الأرض» أو شبكة ثانية.'});
    watch(sat,()=>{if(isSat)$('mapnote').textContent='صور الأرض ما تحمّلت على شبكتك. اضغط «خريطة».'});
    osm.addTo(map);
    map.on('click',e=>map.panTo(e.latlng));
    map.on('moveend',()=>{clearTimeout(mt);mt=setTimeout(()=>{const p=map.getCenter();show(p.lat,p.lng)},200)});
  }else{map.setView(c,17)}
  $('mapnote').textContent='';
  map.invalidateSize();setTimeout(()=>{map.invalidateSize();map.setView(map.getCenter())},150);
  show(c[0],c[1]);
}
function fail(code){
  gpsFailed=true;
  $('retry').hidden=false;$('retry').disabled=false;
  $('nol').href=wl(base+'\n\n📍 الموقع: ما تحدد، بأرسله من الواتساب');$('nol').hidden=false;
  $('msg').className='err';
  $('msg').textContent=code===1?'ما انسمح بالموقع. اسمح للصفحة بالموقع من إعدادات المتصفح ثم حاول مرة ثانية، أو اختر موقعك من الخريطة أدناه.':'ما قدرنا نحدد موقعك. تأكد أن GPS شغال وحاول مرة ثانية، أو اختر موقعك من الخريطة أدناه.';
  openMap(cur||[SHOP_LAT,SHOP_LNG]).then(()=>{$('nol').hidden=false});
}
function locate(){
  $('retry').hidden=true;$('nol').hidden=true;$('msg').className='';$('msg').textContent='جاري تحديد موقعك…';
  if(!navigator.geolocation){fail(0);return}
  navigator.geolocation.getCurrentPosition(p=>{
    const la=p.coords.latitude,ln=p.coords.longitude;
    if(q.get('pop')&&window.opener){
      try{const c=calc(la,ln);window.opener.postMessage({taibaLoc:1,lat:la,lng:ln,tier:c.km<1?'d1':c.km<=3?'d3':'d9'},'*');
        $('msg').textContent='✅ تم تحديد موقعك. ارجع لصفحة الطلب.';setTimeout(()=>{try{window.close()}catch(e){}},1200);return}catch(e){}
    }
    gpsFailed=false;cur=[la,ln];$('retry').hidden=true;
    openMap(cur);
  },e=>fail(e.code),{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
$('tMap').onclick=()=>setLayer(false);$('tSat').onclick=()=>setLayer(true);
$('me').onclick=()=>{if(cur&&map){map.setView(cur,17)}else locate()};
$('retry').onclick=locate;
loadLeaflet().catch(()=>{LP=null});
locate();
</script>
</body></html>
