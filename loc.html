<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>حدد موقعك — أسواق طيبة</title>
<link rel="icon" href="logo.png">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;background:#f4f6f3;color:#13261d;font-family:Tahoma,sans-serif;text-align:center}
img{width:90px;border-radius:22px}
h1{font-size:22px;margin:0}
p{margin:0;font-size:16px;line-height:1.7;max-width:420px}
button,a.btn{display:block;width:100%;max-width:420px;box-sizing:border-box;border:0;border-radius:14px;padding:16px;font-size:19px;font-weight:700;font-family:inherit;text-decoration:none;cursor:pointer}
#go{background:#0a3d2d;color:#fff}
#wa{background:#25d366;color:#fff}
.err{color:#b42318}
</style></head><body>
<img src="logo.png" alt="">
<h1>📍 حدد موقعك للتوصيل</h1>
<p id="msg">اضغط الزر ووافق على إذن الموقع، وبعدها يفتح لك الواتساب برسالة فيها موقعك، أرسلها.</p>
<button id="go" type="button">📍 حدد موقعي</button>
<a class="btn" id="wa" href="#" hidden>أرسل موقعي على الواتساب</a>
<script>
const SHOP='966539137077';
const o=(new URLSearchParams(location.search).get('o')||'').replace(/\D/g,'').slice(0,8);
const msg=document.getElementById('msg'),go=document.getElementById('go'),wa=document.getElementById('wa');
go.onclick=()=>{
  if(!navigator.geolocation){msg.className='err';msg.textContent='جوالك ما يدعم تحديد الموقع. أرسل موقعك من الواتساب: 📎 ثم «الموقع».';return}
  go.textContent='جاري تحديد موقعك…';go.disabled=true;
  navigator.geolocation.getCurrentPosition(p=>{
    const la=p.coords.latitude.toFixed(6),ln=p.coords.longitude.toFixed(6);
    const t='📍 موقعي للتوصيل'+(o?' (طلب #'+o+')':'')+':\nhttps://maps.google.com/?q='+la+','+ln;
    wa.href='https://wa.me/'+SHOP+'?text='+encodeURIComponent(t);
    wa.hidden=false;go.hidden=true;msg.className='';
    msg.textContent='✅ تم تحديد موقعك. اضغط الزر الأخضر وأرسل الرسالة.';
    location.href=wa.href;
  },e=>{
    go.disabled=false;go.textContent='📍 حاول مرة ثانية';msg.className='err';
    msg.textContent=e.code===1?'رفضت إذن الموقع. افتح إعدادات المتصفح واسمح بالموقع لهذه الصفحة، أو أرسل موقعك من الواتساب: 📎 ثم «الموقع».':'ما قدرنا نحدد موقعك. تأكد أن الموقع (GPS) شغال في جوالك وحاول مرة ثانية.';
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
};
</script>
</body></html>
