<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>موقعك للتوصيل — أسواق طيبة</title>
<link rel="icon" href="logo.png">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box;background:#f4f6f3;color:#13261d;font-family:Tahoma,sans-serif;text-align:center}
img{width:90px;border-radius:22px}
h1{font-size:22px;margin:0}
p{margin:0;font-size:16px;line-height:1.7;max-width:420px}
button,a.btn{display:block;width:100%;max-width:420px;box-sizing:border-box;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;font-family:inherit;text-decoration:none;cursor:pointer}
#retry{background:#0a3d2d;color:#fff}
#wa{background:#25d366;color:#fff}
#nol{background:#e3e8e4;color:#13261d}
.err{color:#b42318}
</style></head><body>
<img src="logo.png" alt="">
<h1>📍 نحدد موقعك ونرسل طلبك</h1>
<p id="msg">وافق على إذن الموقع، وبعدها يفتح الواتساب بطلبك كامل ومعه موقعك.</p>
<button id="retry" type="button" hidden>📍 حاول مرة ثانية</button>
<a class="btn" id="wa" href="#" hidden>أرسل الطلب على الواتساب</a>
<a class="btn" id="nol" href="#" hidden>أرسل الطلب بدون موقع (أرسله من الواتساب)</a>
<script>
const SHOP='966539137077',SHOP_LAT=26.3092878,SHOP_LNG=44.8183906;
const q=new URLSearchParams(location.search);
const order=(q.get('m')||'').slice(0,3500);
const o=(q.get('o')||'').replace(/\D/g,'').slice(0,8);
const base=order||('📍 موقعي للتوصيل'+(o?' (طلب #'+o+')':''));
const $=id=>document.getElementById(id);
const wl=t=>'https://wa.me/'+SHOP+'?text='+encodeURIComponent(t);
function fail(code){
  $('retry').hidden=false;$('retry').disabled=false;
  $('nol').href=wl(base+'\n\n📍 الموقع: ما تحدد، بأرسله من الواتساب');$('nol').hidden=false;
  $('msg').className='err';
  $('msg').textContent=code===1?'ما انسمح بالموقع. اسمح للصفحة بالموقع من إعدادات المتصفح ثم حاول مرة ثانية، أو أرسل الطلب بدون موقع.':'ما قدرنا نحدد موقعك. تأكد أن GPS شغال وحاول مرة ثانية، أو أرسل الطلب بدون موقع.';
}
function locate(){
  $('retry').hidden=true;$('nol').hidden=true;$('msg').className='';$('msg').textContent='جاري تحديد موقعك…';
  if(!navigator.geolocation){fail(0);return}
  navigator.geolocation.getCurrentPosition(p=>{
    const la=p.coords.latitude,ln=p.coords.longitude,R=6371,r=x=>x*Math.PI/180;
    const dl=r(la-SHOP_LAT),dn=r(ln-SHOP_LNG);
    const a=Math.sin(dl/2)**2+Math.cos(r(SHOP_LAT))*Math.cos(r(la))*Math.sin(dn/2)**2;
    const km=2*R*Math.asin(Math.sqrt(a));
    const sub=parseFloat(q.get('s'));
    let tier,fee;
    if(km<1){tier='أقل من 1 كم';fee=sub>=20?0:2}
    else if(km<=3){tier='من 1 إلى 3 كم';fee=sub>=20?1:3}
    else{tier='أكثر من 3 كم';fee=5}
    const near=Math.abs(km-1)<0.15||Math.abs(km-3)<0.2;
    let d='';
    if(!isNaN(sub))d+='\n\n🛵 رسوم التوصيل المقدرة: '+(fee?fee+' ريال':'مجاني');
    if(near)d+='\n⚠️ راجع الدبوس';
    const t=base+d+'\n\n📍 موقعي: https://maps.google.com/?q='+la.toFixed(6)+','+ln.toFixed(6);
    $('wa').href=wl(t);$('wa').hidden=false;$('retry').hidden=true;$('nol').hidden=true;
    $('msg').innerHTML='✅ تم تحديد موقعك.'+(isNaN(sub)?'':'<br>🛵 رسوم التوصيل المقدرة: <b>'+(fee?fee+' ريال':'مجاني')+'</b>')+'<br>📷 اختياري: لو تبي، بعد ما يفتح الواتساب أرفق صورة بيتك من 📎.<br>يفتح الواتساب بعد ثواني، أو اضغط الزر الأخضر.';
    setTimeout(()=>{location.href=wl(t)},5000);
  },e=>fail(e.code),{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
$('retry').onclick=locate;
locate();
</script>
</body></html>
