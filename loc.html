<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>موقعك للتوصيل — أسواق طيبة</title>
<link rel="icon" href="logo.png">
<script src="lib/fee.js?v=4"></script>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;box-sizing:border-box;background:#f4f6f3;color:#13261d;font-family:Tahoma,sans-serif;text-align:center}
#logo{width:90px;border-radius:22px}
h1{font-size:18px;margin:0}
p{margin:0;font-size:14px;line-height:1.6;max-width:420px}
button,a.btn{display:block;width:100%;max-width:420px;box-sizing:border-box;border:0;border-radius:12px;padding:11px;font-size:16px;font-weight:700;font-family:inherit;text-decoration:none;cursor:pointer}
#retry{background:#0a3d2d;color:#fff}
#wa{background:#25d366;color:#fff}
#nol{background:#e3e8e4;color:#13261d}
.err{color:#b42318}
[hidden]{display:none!important}
#msg{font-weight:700;font-size:15px}
#msg:not(.err){color:#0b1f16}
#msg b{font-size:19px;color:#0a3d2d}
#mapbox{width:100%;max-width:420px}
#tabs{display:flex;gap:6px;margin-bottom:6px}
#tabs button{padding:7px;font-size:14px;background:#fff;color:#0a3d2d;border:2px solid #0a3d2d}
#tabs button.on{background:#0a3d2d;color:#fff}
#mapwrap{position:relative}
#map{height:36vh;min-height:220px;border-radius:14px;border:1px solid #cfd8d1}
#cpin{position:absolute;left:50%;top:50%;width:44px;height:56px;margin:-52px 0 0 -22px;z-index:1000;pointer-events:none;font-size:46px;line-height:56px;text-align:center;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
#me{background:#fff;color:#0a3d2d;border:2px solid #0a3d2d;margin-top:6px;padding:8px;font-size:14px}
#mapnote{font-size:14px;margin-bottom:6px}
body.mapping #logo,body.mapping h1{display:none}
</style></head><body>
<img id="logo" src="logo.png" alt="">
<h1>📍 نحدد موقعك ونرسل طلبك</h1>
<p id="msg">وافق على إذن الموقع، وبعدها نعرض لك موقعك على الخريطة.</p>
<div id="mapbox" hidden>
<div id="tabs"><button id="tMap" type="button" class="on">🗺️ خريطة</button><button id="tSat" type="button">🛰️ صور الأرض</button></div>
<p id="mapnote" class="err"></p>
<div id="mapwrap"><div id="map"></div><div id="cpin">📍</div></div>
<button id="me" type="button">🎯 ارجع لموقعي الحالي</button>
</div>
<a class="btn" id="wa" href="#" hidden>✅ موافق، أرسل الطلب على الواتساب</a>
<button id="retry" type="button" hidden>📍 حاول مرة ثانية</button>
<a class="btn" id="nol" href="#" hidden>أرسل الطلب بدون موقع (أرسله من الواتساب)</a>
<script>
const SHOP='966539137077',SHOP_LAT=TBFEE.SHOP_LAT,SHOP_LNG=TBFEE.SHOP_LNG;
const q=new URLSearchParams(location.search);
const order=(q.get('m')||'').slice(0,3500);
const PK=q.get('pk')==='1'||q.get('pk')==='2',PKD=q.get('pk')==='2';/* pk=2: توصيل وموقع الزبون محفوظ في صفحة الأسعار، فلا نحدد موقعه من جديد ونكتفي بتأكيد وعدّ *//* استلام من المحل: صفحة تأكيد بلا موقع، وتُعدّ على نموذج Tally ثالث */
const o=(q.get('o')||'').replace(/\D/g,'').slice(0,8);
const PKRE=/\n*📦 صور الطلب للتجهيز:.*$/m,pkLine=((order.match(PKRE)||[''])[0]).trim();/* picking-photos link goes last, after the location link, with the delivery fee added */
const base=(order?order.replace(PKRE,''):'')||('📍 موقعي للتوصيل'+(o?' (طلب #'+o+')':''));
const $=id=>document.getElementById(id);
const wl=t=>'https://wa.me/'+SHOP+'?text='+encodeURIComponent(t);
const sub=parseFloat(q.get('s'));
let cur=null,map=null,sat=null,osm=null,osmAlt=null,isSat=false,gpsFailed=false,mt=null;
const money=x=>String(Math.round(x*100)/100);
// الحساب كله من lib/fee.js (المصدر الوحيد لكل الصفحات)
const TIERS=TBFEE.TIERS;
function rkOf(la,ln){return TBFEE.rk(la,ln)}
function feeOf(rk,sv){return TBFEE.fee(rk,sv)}
function calc(la,ln){
  const rk=rkOf(la,ln);
  return {km:TBFEE.road(rk),lv:TBFEE.lvl(rk),fee:feeOf(rk,sub),near:TBFEE.near(rk)};
}
function calc2(la,ln,sv){return feeOf(rkOf(la,ln),sv)}
function show(la,ln){
  const c=calc(la,ln),fee=c.fee;
  let body=base;
  if(isNaN(sub)){
    const f20=calc2(la,ln,25),fl=calc2(la,ln,0);
    {const F=x=>x?x+' ريال':'مجاني';body+=f20!==fl?'\n\n🛵 *رسوم التوصيل (للمجهز):*\nالفاتورة أقل من 20 ← *'+F(fl)+'*\nالفاتورة 20 فأكثر ← *'+F(f20)+'*':'\n\n🛵 *رسوم التوصيل:* '+F(fl);}
  }else{
    const br='🧾 قيمة الطلب: '+money(sub)+' ريال\n🛵 التوصيل (تقديري): '+(fee?fee+' ريال':'مجاني')+'\n💰 الإجمالي التقريبي: '+money(sub+fee)+' ريال\n_والمحل يؤكد السعر النهائي_';
    const re=/^.*المجموع التقريبي.*$/m;
    body=re.test(base)?base.replace(re,()=>br):base+'\n\n'+br;
  }
  body+='\n🏍️ مستوى المندوب: '+['','١','٢','٣'][c.lv];
  if(c.near)body+='\n⚠️ راجع الدبوس';
  const t=body+'\n\n📍 موقعي (اضغطه للرسوم والخريطة): https://tibhesm-hue.github.io/taibastore/m.html?v=2&q='+la.toFixed(6)+','+ln.toFixed(6);
  $('wa').href=wl(t+(pkLine?'\n\n'+pkLine+'~f.'+(isNaN(sub)?calc2(la,ln,0):fee):''));$('wa').hidden=false;$('nol').hidden=true;
  $('msg').className='';
  $('msg').innerHTML=(gpsFailed?'⚠️ ما تحدد موقعك تلقائيًا، حرّك الخريطة إلى بيتك.':'✅ تم تحديد موقعك.')+'<br>🛵 رسوم التوصيل: <b>'+(isNaN(sub)?(x=>(x?x+' ريال':'مجاني')+'</b>')(calc2(la,ln,0)):(fee?fee+' ريال':'مجاني')+'</b>')+'<br><span style="font-size:13px;font-weight:400">إذا الدبوس مو على بيتك: حرّك الخريطة أو المس المكان، ثم اضغط «موافق».</span>';
}
let LP=null;
function loadLeaflet(){
  if(LP)return LP;
  return LP=new Promise((res,rej)=>{
    if(window.L)return res();
    const l=document.createElement('link');l.rel='stylesheet';l.href='lib/leaflet.css';document.head.appendChild(l);
    const s=document.createElement('script');s.src='lib/leaflet.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);
  });
}
function setLayer(satOn){if(!map||satOn===isSat)return;$('mapnote').textContent='';if(satOn){map.removeLayer(osm);map.removeLayer(osmAlt);sat.addTo(map)}else{map.removeLayer(sat);(map.hasLayer(osmAlt)?0:osm.addTo(map))}isSat=satOn;$('tSat').classList.toggle('on',satOn);$('tMap').classList.toggle('on',!satOn)}
async function openMap(c){
  try{await loadLeaflet()}catch(e){show(c[0],c[1]);return}
  $('mapbox').hidden=false;document.body.classList.add('mapping');
  if(!map){
    map=L.map('map',{zoomControl:true}).setView(c,17);
    sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'});
    osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
    osmAlt=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap © CARTO'});
    const watch=(layer,onFail)=>{let ok=false,er=0;layer.on('tileload',()=>{ok=true});layer.on('tileerror',()=>{if(++er===3&&!ok)onFail()});layer.on('add',()=>{ok=false;er=0;setTimeout(()=>{if(!ok&&map.hasLayer(layer))onFail()},7000)})};
    watch(osm,()=>{if(!isSat&&map.hasLayer(osm)){map.removeLayer(osm);osmAlt.addTo(map)}});
    watch(osmAlt,()=>{if(!isSat)$('mapnote').textContent='الخريطة بطيئة أو محجوبة على شبكتك. جرّب «صور الأرض» أو شبكة ثانية.'});
    watch(sat,()=>{if(isSat)$('mapnote').textContent='صور الأرض ما تحمّلت على شبكتك. اضغط «خريطة».'});
    osm.addTo(map);
    map.on('click',e=>map.panTo(e.latlng));
    map.on('moveend',()=>{clearTimeout(mt);mt=setTimeout(()=>{const p=map.getCenter();show(p.lat,p.lng)},200)});
  }else{map.setView(c,17)}
  $('mapnote').textContent='';
  map.invalidateSize();setTimeout(()=>{map.invalidateSize();map.setView(map.getCenter())},150);
  show(c[0],c[1]);
}
function fail(code){
  gpsFailed=true;
  $('retry').hidden=false;$('retry').disabled=false;
  $('nol').href=wl(base+'\n\n📍 الموقع: ما تحدد، بأرسله من الواتساب'+(pkLine?'\n\n'+pkLine:''));$('nol').hidden=false;
  $('msg').className='err';
  $('msg').textContent=code===1?'ما انسمح بالموقع. اسمح للصفحة بالموقع من إعدادات المتصفح ثم حاول مرة ثانية، أو اختر موقعك من الخريطة أدناه.':'ما قدرنا نحدد موقعك. تأكد أن GPS شغال وحاول مرة ثانية، أو اختر موقعك من الخريطة أدناه.';
  openMap(cur||[SHOP_LAT,SHOP_LNG]).then(()=>{$('nol').hidden=false});
}
function locate(){
  $('retry').hidden=true;$('nol').hidden=true;$('msg').className='';$('msg').textContent='جاري تحديد موقعك…';
  if(!navigator.geolocation){fail(0);return}
  navigator.geolocation.getCurrentPosition(p=>{
    const la=p.coords.latitude,ln=p.coords.longitude;
    if(q.get('pop')&&window.opener){
      try{const c=calc(la,ln);window.opener.postMessage({taibaLoc:1,lat:la,lng:ln,tier:['','d1','d3','d9'][c.lv]},'*');
        $('msg').textContent='✅ تم تحديد موقعك. ارجع لصفحة الطلب.';setTimeout(()=>{try{window.close()}catch(e){}},1200);return}catch(e){}
    }
    gpsFailed=false;cur=[la,ln];$('retry').hidden=true;
    openMap(cur);
  },e=>fail(e.code),{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
/* عدّاد طلبات رابط الأسعار (19/11، صاحب المحل: «أدري كم زبون طلب من رابط الأسعار»).
   نموذجان مخفيان على Tally، وعدد زياراتهما يُقرأ في دفتر طيبة:
   B = الزبون وصل لهذه الصفحة من زر «أرسل الطلب» في رابط الأسعار، A = ضغط زر الإرسال للواتساب.
   العدّ مرة واحدة لكل رقم طلب (الجديد، أو تعديل لرقم ما انعدّ)، ولا يظهر للزبون ولا يؤخّر فتح الواتساب، وأي خطأ فيه لا يمسّ الطلب.
   إن ضغط الزبون وانتقل قبل ما يكتمل العدّ، تُعاد المحاولة لما يرجع للصفحة (3 محاولات على الأكثر). */
const CNT_A='rDOMyX',CNT_B='jeoAbJ',CNT_C='M1apV8',CNT_K='tb-cnt';
const cntNo=((order.match(/(?:طلب جديد|تعديل طلب)[^#\n]*#\s*(\d{3,8})/)||[])[1])||(PK?'pk'+Date.now().toString(36):'');
let cntMem={},cntFA=null,cntFB=null;
function cntAll(){try{const m=JSON.parse(localStorage.getItem(CNT_K)||'{}');return m&&typeof m==='object'?m:{}}catch(e){return {}}}
function cntGet(){return cntAll()[cntNo]||cntMem[cntNo]||null}
function cntSet(p){const m=cntAll(),now=Date.now(),e=Object.assign({t:now},m[cntNo]||cntMem[cntNo]||{},p);cntMem[cntNo]=e;m[cntNo]=e;for(const k in m)if(now-(+m[k].t||0)>2*864e5)delete m[k];try{localStorage.setItem(CNT_K,JSON.stringify(m))}catch(x){}}
function cntFrame(form,kind,done){const f=document.createElement('iframe');
  f.src='https://tally.so/embed/'+form+'?hideTitle=1&transparentBackground=1&no='+encodeURIComponent(cntNo)+'&k='+kind+'&t='+Date.now();
  f.title='';f.setAttribute('aria-hidden','true');f.tabIndex=-1;
  f.style.cssText='position:fixed;left:0;bottom:0;width:320px;height:240px;border:0;opacity:0;pointer-events:none;z-index:-1';
  f.addEventListener('load',()=>setTimeout(()=>{try{done()}catch(x){}},1800));
  document.body.appendChild(f);return f}
function cntReach(){try{if(!cntNo||cntFB)return;const e=cntGet();if(e&&e.r)return;cntFB=cntFrame(CNT_B,'r',()=>cntSet({r:1}))}catch(x){}}
function cntTap(kind){try{if(!cntNo||cntFA)return;const e=cntGet()||{};if(e.a===2||(+e.n||0)>=3)return;cntSet({a:1,n:(+e.n||0)+1,k:kind});cntFA=cntFrame(kind==='pk'?CNT_C:CNT_A,kind,()=>cntSet({a:2}))}catch(x){}}
function cntBack(){try{const e=cntGet();if(!e||e.a!==1)return;setTimeout(()=>{try{const x=cntGet();if(x&&x.a===1){if(cntFA){cntFA.remove();cntFA=null}cntTap(x.k||'del')}}catch(y){}},3500)}catch(x){}}
$('wa').addEventListener('click',()=>cntTap(PK&&!PKD?'pk':'del'));
$('nol').addEventListener('click',()=>cntTap('noloc'));
window.addEventListener('pageshow',cntBack);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')cntBack()});
if(cntNo&&!PK)setTimeout(cntReach,1500);
$('tMap').onclick=()=>setLayer(false);$('tSat').onclick=()=>setLayer(true);
$('me').onclick=()=>{if(cur&&map){map.setView(cur,17)}else locate()};
$('retry').onclick=locate;
if(PK){document.querySelector('h1').textContent=PKD?'🛵 تأكيد طلب التوصيل':'🛍️ تأكيد طلب الاستلام من المحل';$('msg').className='';$('msg').textContent='اضغط الزر الأخضر لإرسال طلبك على الواتساب، ونجهزه لك للاستلام.';$('wa').href=wl(order||(PKD?'🛵 طلب توصيل':'🛍️ طلب استلام من المحل'));$('wa').textContent='✅ أرسل الطلب على الواتساب';$('wa').hidden=false}else{loadLeaflet().catch(()=>{LP=null});
locate()}
</script>
</body></html>
