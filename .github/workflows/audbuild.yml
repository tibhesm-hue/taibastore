name: audbuild
on: workflow_dispatch
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: bash tools/audbuild.sh
      - run: |
          git config user.name "audbuild"; git config user.email "audbuild@users.noreply.github.com"
          git add itqan/audio && git commit -qm "itqan: listening audio files (Ghamadi)" && git pull -q --rebase && git push -q
