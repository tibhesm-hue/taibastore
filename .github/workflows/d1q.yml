name: d1q
on:
  workflow_dispatch:
    inputs: {qs: {required: true}}
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node tools/d1q.mjs
        env: {CF_TOKEN: "${{ secrets.CF_TOKEN }}", QS: "${{ inputs.qs }}"}
