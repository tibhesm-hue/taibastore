name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do
          curl -s -o /dev/null -w "PAGE %{http_code} %{time_total} %{size_download}\n" "https://tibhesm-hue.github.io/taibastore/itqan/?x=$RANDOM"
          curl -s -o /dev/null -w "WORKER %{http_code} %{time_total}\n" "https://itqan.w-f-almateq.workers.dev/"
          curl -s -o /dev/null -w "TJALL %{http_code} %{time_total} %{size_download}\n" -X POST "https://itqan.w-f-almateq.workers.dev/?it=tjall&k=taj-48132d5dec65" -d '{}'
          curl -s -o /dev/null -w "SNAP %{http_code} %{time_total} %{size_download}\n" -X POST "https://itqan.w-f-almateq.workers.dev/?it=tjsnap&k=taj-48132d5dec65" -d '{}'
          done
