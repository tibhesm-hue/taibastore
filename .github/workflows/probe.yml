name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in itqan/audio/021-073-078.mp3 taj/audio/021-073-078.mp3 audio/021-073-078.mp3; do echo "$u $(curl -s -o /dev/null -w '%{http_code}' https://tibhesm-hue.github.io/taibastore/$u)"; done
          curl -s https://tibhesm-hue.github.io/taibastore/itqan/taj.html | grep -o 'audio/[^"]\{0,40\}' | head -3
