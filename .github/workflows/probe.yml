name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 30 -D - -o /dev/null -H 'Origin: https://tibhesm-hue.github.io' https://itqan.w-f-almateq.workers.dev/ | tr -d '\r' | grep -i -E 'HTTP|access-control|content-type|cache'
          curl -s -m 30 -D - -o /dev/null https://tibhesm-hue.github.io/taibastore/itqan/taj.html | tr -d '\r' | grep -i -E 'HTTP|cache-control|last-modified|age:'
          curl -s -m 30 https://tibhesm-hue.github.io/taibastore/itqan/taj.html | grep -c 'يعيد المحاولة لحاله'
          curl -s -m 30 https://tibhesm-hue.github.io/taibastore/itqan/ | grep -c 'يعيد المحاولة لحاله'
