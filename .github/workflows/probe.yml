name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U='https://itqan.w-f-almateq.workers.dev/?k=taj-48132d5dec65&it='
          curl -s -X POST "${U}tjsnap" -H 'content-type:text/plain' -d '{}' | python3 -c "
          import json,sys;d=json.load(sys.stdin)['snap'];print('AT',d['at'])
          for l in d['logs']:
            if l['sid'] in('s03','s07') and l['date']>='2026-11-20':print('LOG',json.dumps(l,ensure_ascii=False))"
