name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > pub.pem <<'K'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAsuAJYKHGQ7jXU9UFdbJd
          1iRtUiG6am5qSKzSkDLYH8G6KCacbQit/GnHzmWX6NAXpZj0q+y1whXVI0edavDl
          Xkf4Y1pHb21FKa3ZzOb5HTmYfnbrBHE9MSpPTxqQQFJXk3WdGa29oSsM4jnWPXaU
          sPcNOMTgVhgVsy1wCuMvL4yYYu56Uf487Tv7SMJBp12tOPWGzGNVhLQU7wGHXg6D
          QU4zbNTmpKk98yWrUTJ3O2yqDLTHVMaQgdCK2/YA65OkTMiGz6FvX+8hYmlWd505
