<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>رسوم التوصيل</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f766e">
<style>body{font-family:system-ui,Tahoma,sans-serif;margin:0;padding:16px;background:#f6f7f8;color:#111}h1{font-size:22px;margin:4px 0 14px}
.c{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px #0001}
.mu{color:#666;font-size:14px}.bad{color:#b91c1c;font-weight:700}
.lnk{display:block;text-align:center;color:#0f766e;font-size:14px;text-decoration:underline;margin-top:8px;background:none;border:0;width:100%;font-family:inherit}
textarea{width:100%;box-sizing:border-box;font-size:15px;padding:8px;border-radius:8px;border:1px solid #ccc;min-height:70px}
.go{font-size:16px;padding:10px;border-radius:10px;border:0;background:#0f766e;color:#fff;width:100%;margin-top:8px;font-family:inherit}
[hidden]{display:none!important}</style></head><body>
<h1>رسوم التوصيل</h1>
<div class="c" id="inst" hidden>ثبّت التطبيق مرة واحدة: من قائمة كروم ⋮ اختر «تثبيت التطبيق».<button class="go" id="ib">تثبيت</button></div>
<div id="out"><div class="c mu">شارك موقع الزبون من خرائط قوقل واختر «رسوم التوصيل».</div></div>
<button class="lnk" id="pl" type="button">الموقع ما وصل؟ الصقه هنا</button>
<div class="c" id="pbox" hidden><textarea id="pt" placeholder="الصق رابط الموقع أو الإحداثيات"></textarea><button class="go" id="go">احسب</button></div>
<script src="../lib/fee.js?v=2"></script>
<script>
const $=i=>document.getElementById(i);
const W='https://taiba-loc.tibh-esm.workers.dev';
function show(p){TBFEE.render($('out'),p[0],p[1])}
function fail(t){$('out').innerHTML='<div class="c"><div class="bad">'+t+'</div><div class="mu" style="margin-top:6px">جرّب «الموقع ما وصل؟ الصقه هنا».</div></div>';$('pbox').hidden=false}
async function run(s){
 if(!s)return;const p=TBFEE.parse(s);if(p)return show(p);
 const m=s.match(/https?:\/\/(?:maps\.app\.goo\.gl|goo\.gl\/maps)\/[A-Za-z0-9_-]+/);
 if(!m)return fail('ما فيه موقع في اللي وصل.');
 $('out').innerHTML='<div class="c mu">جاري قراءة الموقع…</div>';
 try{const r=await Promise.race([fetch(W+'/?u='+encodeURIComponent(m[0])),new Promise((_,j)=>setTimeout(()=>j(new Error('t')),15000))]);const j=await r.json();
  if(j.lat)return show([j.lat,j.lng]);}catch(e){}
 fail('ما قدرت أقرأ الموقع من الرابط.');
}
const q=new URLSearchParams(location.search);
run([q.get('title'),q.get('text'),q.get('url')].filter(Boolean).join(' \n'));
$('pl').onclick=()=>{$('pbox').hidden=!$('pbox').hidden};
$('go').onclick=()=>run($('pt').value);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('inst').hidden=false});$('ib').onclick=()=>dp&&dp.prompt();
</script></body></html>
